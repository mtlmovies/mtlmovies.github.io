<!doctype html>
<html lang="fr-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Montréal Cinéma — showtimes across the city</title>
<meta name="description" content="Every cinema showtime in Greater Montréal: repertory houses, classics, restorations, 35 mm projections and the big rooms. Filter by day, cinema, neighbourhood, language and format.">
<meta name="theme-color" content="#08080a">
<meta property="og:title" content="Montréal Cinéma">
<meta property="og:description" content="Every cinema showtime in Greater Montréal, in one place.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%F0%9F%8E%9E%EF%B8%8F%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="preload" href="./data/index.json" as="fetch" crossorigin>
<link rel="stylesheet" href="./styles.css">
</head>
<body>

<header class="nav">
  <div class="brand">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="2.5" y="5.5" width="19" height="13" rx="2.5"/>
      <path d="M2.5 9h19M2.5 15h19M7 5.5v13M17 5.5v13"/>
    </svg>
    Montréal&nbsp;Cinéma <span id="brand-tag"></span>
  </div>

  <div class="nav-sp"></div>

  <div class="nav-act">
    <div class="search">
      <input id="q" type="search" autocomplete="off" spellcheck="false">
      <button class="iconbtn" id="search-btn" aria-label="Search">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
          <circle cx="7" cy="7" r="4.3"/><path d="m10.3 10.3 3.2 3.2"/>
        </svg>
      </button>
    </div>

    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="fr" aria-pressed="true">FR</button>
      <button type="button" data-lang="en" aria-pressed="false">EN</button>
    </div>

    <button class="iconbtn" id="theme" aria-label="Theme">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="8" cy="8" r="3.1"/><path d="M8 1v1.6M8 13.4V15M15 8h-1.6M2.6 8H1M12.9 3.1l-1.1 1.1M4.2 11.8l-1.1 1.1M12.9 12.9l-1.1-1.1M4.2 4.2 3.1 3.1"/>
      </svg>
    </button>
  </div>
</header>

<section class="hero" id="hero" hidden></section>

<nav class="bar" aria-label="Filters">
  <div class="bar-row">
    <div class="days" id="days" role="group"></div>
  </div>
  <div class="bar-row">
    <div class="chips">
      <button class="chip" id="chip-classic" data-tag="classic" aria-pressed="false"></button>
      <button class="chip" id="chip-resto" data-tag="restoration" aria-pressed="false"></button>
      <button class="chip" id="chip-film" data-tag="celluloid" aria-pressed="false"></button>
      <button class="chip" id="chip-indie" aria-pressed="false"></button>
      <button class="chip" id="chip-vf" data-langv="fr" aria-pressed="false"></button>
      <button class="chip" id="chip-vo" data-langv="en" aria-pressed="false"></button>
      <button class="chip" id="chip-sub" data-langv="sub" aria-pressed="false"></button>
      <div class="sel" id="f-venue"></div>
      <div class="sel" id="f-hood"></div>
      <div class="sel" id="f-genre"></div>
      <div class="sel" id="f-sort"></div>
    </div>
    <div class="viewtoggle" role="group">
      <button type="button" id="view-grid" data-view="grid" aria-pressed="true" aria-label="Grid">
        <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><rect x="1.5" y="1.5" width="5.5" height="5.5" rx="1.2"/><rect x="9" y="1.5" width="5.5" height="5.5" rx="1.2"/><rect x="1.5" y="9" width="5.5" height="5.5" rx="1.2"/><rect x="9" y="9" width="5.5" height="5.5" rx="1.2"/></svg>
      </button>
      <button type="button" id="view-list" data-view="list" aria-pressed="false" aria-label="List">
        <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><rect x="1.5" y="2.5" width="13" height="2" rx="1"/><rect x="1.5" y="7" width="13" height="2" rx="1"/><rect x="1.5" y="11.5" width="13" height="2" rx="1"/></svg>
      </button>
    </div>
    <button class="reset" id="f-reset"></button>
  </div>
</nav>

<main id="content">
  <div class="sec"><div class="grid">
    <div class="skel"></div><div class="skel"></div><div class="skel"></div>
    <div class="skel"></div><div class="skel"></div><div class="skel"></div>
  </div></div>
</main>

<footer class="foot">
  <span id="meta"></span>
  <span id="foot-note"></span>
  <a href="https://github.com/RodolpheKouyoumdjian/mtlmovies" id="foot-src"></a>
  <span id="foot-made"></span>
</footer>

<div class="modal" id="modal" hidden role="dialog" aria-modal="true">
  <div class="scrim"></div>
  <div class="panel" id="panel"></div>
</div>

<script src="./app.js"></script>
</body>
</html>
